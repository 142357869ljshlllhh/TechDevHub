# 生产环境配置（Docker 部署用，激活方式：SPRING_PROFILES_ACTIVE=prod）
# 与默认 application.yml 的区别：
#   1. 关闭 Nacos 服务发现（2G 服务器省 ~350MB，避免又一处 OOM 风险）
#   2. 网关路由改为静态服务名寻址（Docker 内网 DNS 解析容器名）
# 本地开发请用默认 profile（lb:// + Nacos），此文件不生效。

spring:
  cloud:
    nacos:
      discovery:
        enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://user-service:8081
              predicates:
                - Path=/users/**
            - id: blog-service
              uri: http://blog-service:8082
              predicates:
                - Path=/blogs/**
            - id: category-service
              uri: http://category-service:8083
              predicates:
                - Path=/categories/**
            - id: follow-service
              uri: http://follow-service:8084
              predicates:
                - Path=/follows/**
            - id: like-service
              uri: http://like-service:8085
              predicates:
                - Path=/likes/**
            - id: comment-service
              uri: http://comment-service:8086
              predicates:
                - Path=/comments/**
            - id: ai-service
              uri: http://ai-service:8088
              predicates:
                - Path=/ai/**

server:
  port: 8090
