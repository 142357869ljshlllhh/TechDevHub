spring:
  application:
    name: comment-service
  datasource:
    url: jdbc:mysql://localhost:3306/comment?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848

mybatis:
  configuration:
    map-underscore-to-camel-case: true

techdevhub:
  jwt:
    secret-key: ${TECHDEVHUB_JWT_SECRETKEY}
    expiration: 86400000
    issuer: techdevhub
    header-name: Authorization
    token-prefix: "Bearer "
    exclude-paths:
      - /swagger-ui/**
      - /swagger-ui.html
      - /v3/api-docs/**
      - /webjars/**
      - /comments/swagger-ui/**
      - /comments/swagger-ui.html
      - /comments/v3/api-docs/**

server:
  port: 8086

# Feign 使用 Apache HttpClient 5（原生支持 PATCH，避免 JDK HttpURLConnection 的 Invalid HTTP method: PATCH）
# 注意：Spring Cloud 2025.0.0(OpenFeign 4.3.0) 已删除 HC4 自动配置，必须用 hc5，不能用 httpclient
feign:
  hc5:
    enabled: true
